name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Node 22.22.3
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.22.3
      - name: Install Pi 0.81.1 for extension checks
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/qq-pi" --no-save --ignore-scripts \
            @earendil-works/pi-coding-agent@0.81.1
          echo "$RUNNER_TEMP/qq-pi/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Run shell tests
        run: tools/test.sh
