- id: hmr
  disabled: true

- id: session-persistence-jsonl
  config:
    root: !!js dshHomePath('sessions')
    compression: none
    writeBatchMaxDelayMs: 20

- insert:
    - id: qq-native-delegation-proof
      name: '@hypermemetic-ai/qq-dsh-native-delegation-proof'
      inject: [agentDefaultModel, agents, sessions, sessionPersistence, subagents]
      config:
        phase: !!js process.env.QQ_DSH_NATIVE_PHASE
        architectSession: !!js process.env.QQ_DSH_NATIVE_ARCHITECT
        statePath: !!js process.env.QQ_DSH_NATIVE_STATE_PATH
        cwd: !!js process.cwd()
