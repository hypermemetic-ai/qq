- id: session-persistence-jsonl
  config:
    root: !!js dshHomePath('sessions')
    compression: none
    writeBatchMaxDelayMs: 20

- insert:
    - id: qq-native-qa-proof
      name: '@hypermemetic-ai/qq-dsh-native-qa-proof'
      inject: [agentDefaultModel, agents, llm, sessions, sessionPersistence, systemPrompt, tools]
      config:
        phase: !!js process.env.QQ_DSH_NATIVE_PHASE
        statePath: !!js process.env.QQ_DSH_NATIVE_STATE_PATH
