# qq intentionally replaces Pi's built-in read tool. DSH's headless bundle
# registers its own read first, while pi2dsh 0.12.3 rejects that collision.
# Disable only the native filesystem tool bundle in this isolated profile.
- id: tool-fs
  disabled: true

# Keep this isolated evidence artifact as plaintext so verify.mjs can inspect
# the durable DSH record without adding compression-codec logic to the probe.
- id: session-persistence-jsonl
  config:
    root: !!js dshHomePath('sessions')
    compression: none
