# qq-owned HTML console over the DSH base bundle. This is not stock DSH Web:
# there is no api-proxy, React client roster, WebSocket, or frontend fallback.
# The bundle composes two same-host plugins: qq (logic) and qq-ui (presentation).

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

- id: hmr
  disabled: true

# The workbench selects one real rc.6 pi-ai route rather than inheriting the
# base bundle's DeepSeek default. The exact model is newer than rc.6's installed
# pi-ai catalog, so this profile declares its current non-secret metadata while
# inheriting qwen-token-plan's endpoint/protocol and referencing only its key.
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: !!js process.env.QQ_DSH_PROVIDER ?? 'qwen-token-plan'
    model: !!js process.env.QQ_DSH_MODEL ?? 'deepseek-v4-pro-0813'

- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      qwen-token-plan:
        apiKeyEnv: QWEN_TOKEN_PLAN_API_KEY
        models:
          - id: deepseek-v4-pro-0813
            name: DeepSeek V4 Pro 0813
            contextWindow: 1000000
            maxTokens: 384000
            input: [text]
            reasoningEfforts:
              high: high
              max: max
            compat:
              thinkingFormat: qwen
              supportsDeveloperRole: false
              supportsReasoningEffort: true

- insert:
    - id: qq-console-webserver
      name: '@deepseek-ai/dsh-host-webserver'
      config:
        host: 127.0.0.1
        port: !!js Number(process.env.QQ_DSH_CONSOLE_PORT ?? 3082)

    - id: qq
      name: '@hypermemetic-ai/qq'
      inject: [agents, sessions, sessionPersistence]
      config:
        sessionId: !!js process.env.QQ_DSH_SESSION_ID
        cwd: !!js process.cwd()
        provider: !!js process.env.QQ_DSH_PROVIDER ?? 'qwen-token-plan'
        model: !!js process.env.QQ_DSH_MODEL ?? 'deepseek-v4-pro-0813'
        reasoningEffort: !!js process.env.QQ_DSH_REASONING_EFFORT

    - id: qq-ui
      name: '@hypermemetic-ai/qq-ui'
      inject: [qq, webServer]
      config:
        basePath: /qq
